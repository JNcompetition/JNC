<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="金诺竞赛成长资源站：赛事报名、升学通道、丘班测评、真题、益智游戏、数学工具、AI 助手，一站直达。">
<meta name="theme-color" content="#F6EFE3">
<title>金诺 · 竞赛成长资源站</title>

<!-- ============================================================
  这个文件只负责「骨架」：导航 + 首屏 + 搜索 + 8 个挂载点 + 页脚
  ------------------------------------------------------------
  【改样式】
    css/base.css    全站通用（颜色变量、卡片、胶囊、页脚）
    css/pc.css      只在 ≥769px 生效（左侧固定导航、桌面列数）
    css/mobile.css  只在 ≤768px 生效（顶部栏、抽屉、两列卡片）

  【改某个板块】
    data/<板块>.js     只改内容（标题、说明、链接）
    sections/<板块>.js 只改结构（标题文字、列数、有没有胶囊行）

  【加一个板块】
    1) 新建 data/xxx.js 和 sections/xxx.js
    2) 在下面骨架里加一个挂载点：<div id="xxxMount"></div>
    3) 在页面底部的 script 列表里按顺序加两行
  ============================================================ -->

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pc.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body class="is-expanded">

<div class="shell">

  <!-- ========== 左栏（PC 显示为固定侧栏，手机显示为抽屉） ========== -->
  <aside class="rail" id="rail" aria-label="主导航">
    <div class="brandbar">
      <a class="brand" href="#top">
        <img src="logo.png" alt="金诺竞赛">
        <span class="name"><b>金诺竞赛</b><span>资源站</span></span>
      </a>
      <button class="rail-toggle" id="railToggle" aria-label="收起导航" aria-expanded="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6.5L9 12l5.5 5.5"/></svg>
      </button>
    </div>

    <!-- 导航：href 对应下面各板块的 id -->
    <nav class="nav">
      <a href="#race" title="竞赛入口"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v18"/><path d="M5 4h11l-2 4 2 4H5"/></svg><span class="lb">竞赛入口</span></a>
      <a href="#cup" title="杯赛"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v4a4 4 0 0 1-8 0V4z"/><path d="M8 6H5v2a4 4 0 0 0 4 4M16 6h3v2a4 4 0 0 1-4 4M12 12v4M9 20h6M10 16h4"/></svg><span class="lb">杯赛</span></a>
      <a href="#path" title="升学通道"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-4 9 4-9 4-9-4z"/><path d="M7 11.5V16c0 1.1 2.2 2 5 2s5-.9 5-2v-4.5"/></svg><span class="lb">升学通道</span></a>
      <a href="#paper" title="丘班测评"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="12" height="16" rx="2"/><path d="M9.5 5V3.8h5V5"/><path d="M9.5 11h5M9.5 15h3.5"/></svg><span class="lb">丘班测评</span></a>
      <a href="#test" title="杯赛真题"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/></svg><span class="lb">杯赛真题</span></a>
      <a href="#game" title="益智游戏"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3.2"/><circle cx="9" cy="9" r="1.05"/><circle cx="15" cy="9" r="1.05"/><circle cx="12" cy="15" r="1.05"/></svg><span class="lb">益智游戏</span></a>
      <a href="#tool" title="数学工具"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><path d="M12 7l-4.2 13M12 7l4.2 13"/></svg><span class="lb">数学工具</span></a>
      <a href="#ai" title="AI 助手"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l1.9 4.8 4.8 1.9-4.8 1.9L12 17l-1.9-4.8L5.3 10.3l4.8-1.9z"/></svg><span class="lb">AI 助手</span></a>
    </nav>

    <a class="cta" href="https://mp.weixin.qq.com/mp/profile_ext?action=home&amp;__biz=MzY4NTQ2Njk0Mg==&amp;scene=124#wechat_redirect">联系我们</a>
    <p class="note">外链均为第三方网站，内容以官方发布为准。</p>
  </aside>

  <!-- ========== 右侧联系浮窗（PC） ========== -->
  <aside class="contact-widget" aria-labelledby="contactWidgetTitle">
    <h2 id="contactWidgetTitle">联系我们</h2>
    <a class="contact-entry" href="https://mp.weixin.qq.com/mp/profile_ext?action=home&amp;__biz=MzY4NTQ2Njk0Mg==&amp;scene=124#wechat_redirect" target="_blank" rel="noopener noreferrer" aria-label="打开金诺竞赛公众号">
      <img src="公众号.jpg" alt="金诺竞赛公众号二维码">
      <span>关注公众号</span>
    </a>
    <div class="contact-entry">
      <img src="企微.png" alt="金诺竞赛企业微信二维码">
      <span>添加企业微信</span>
    </div>
  </aside>

  <!-- ========== 主内容 ========== -->
  <div class="main" id="top">

    <!-- 手机顶栏 -->
    <div class="mobilebar">
      <a class="bar-brand" href="#top"><img src="logo.png" alt="金诺竞赛"><span>金诺竞赛资源站</span></a>
      <button class="bar-menu" id="menuBtn" aria-label="打开菜单">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>

    <!-- 首屏：背景图在 css/base.css 的 .hero 里 -->
    <div class="hero">
      <div class="wrap">
        <h1>竞赛升学与成长资源，<em>一站直达</em></h1>
        <p>涵盖五大学科竞赛、各类杯赛与升学通道，并提供真题、益智游戏、数学工具和 AI 助手，陪伴孩子持续成长。</p>
      </div>
    </div>

    <!-- 站内搜索 -->
    <div class="wrap">
      <div class="searchbar">
        <input id="q" type="search" placeholder="搜索赛事、工具、年级…" aria-label="站内搜索">
      </div>
      <p class="empty" id="empty">没有匹配的内容，换个词试试。</p>
    </div>

    <!-- ========== 8 个板块挂载点 ==========
         每个板块的标题、网格、内容都在对应文件里，这里只留一行 -->
    <div id="raceMount"></div>
    <div id="cupMount"></div>
    <div id="pathMount"></div>
    <div id="paperMount"></div>
    <div id="testMount"></div>
    <div id="gameMount"></div>
    <div id="toolMount"></div>
    <div id="aiMount"></div>

    <footer>
      <div class="wrap">
        <div>© 金诺竞赛 · 竞赛成长资源站</div>
        <div>外链均为第三方网站，内容以官方发布为准</div>
      </div>
    </footer>
  </div>
</div>

<!-- ========== 脚本加载顺序（不能打乱） ==========
     1) 所有 data/*.js      → 先把内容挂到 window.SITE_DATA
     2) 所有 sections/*.js  → 再用内容生成每个 <section>
     3) data/render.js      → 最后把 [data-module] 填满
     4) js/app.js           → 交互（导航/搜索） -->
<script src="data/race.js"></script>
<script src="data/cup.js"></script>
<script src="data/path.js"></script>
<script src="data/paper.js"></script>
<script src="data/test.js"></script>
<script src="data/game.js"></script>
<script src="data/tool.js"></script>
<script src="data/ai.js"></script>

<script src="sections/race.js"></script>
<script src="sections/cup.js"></script>
<script src="sections/path.js"></script>
<script src="sections/paper.js"></script>
<script src="sections/test.js"></script>
<script src="sections/game.js"></script>
<script src="sections/tool.js"></script>
<script src="sections/ai.js"></script>

<script src="data/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
